[package]
name = "workstation"
version = "1.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
lancedb = "0.16"
arrow-array = "53"
arrow-schema = "53"
jsonwebtoken = "9"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
log = "0.4"
env_logger = "0.11"
futures = "0.3"
anyhow = "1"
thiserror = "2"

# Phase 1: Core IPC (Electron → Tauri)
flate2 = "1"
rusqlite = { version = "0.31", features = ["bundled-sqlcipher", "column_decltype", "load_extension"] }
keyring = { version = "3", features = ["windows-native"] }
base64 = "0.22"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"
dirs = "5"

# Phase 2: File System + Git
git2 = { version = "0.19", features = ["vendored-libgit2"] }
notify = "6"
ignore = "0.4"
walkdir = "2"
syntect = "5"

# Phase 3: PTY Terminal
portable-pty = "0.8"

# Phase 4: Conversations, Workspaces
glob = "0.3"

# Phase 6: Production
open = "5"
tauri-plugin-deep-link = "2"

[profile.dev]
debug = 1
split-debuginfo = "packed"

[profile.release]
strip = true
lto = "thin"
opt-level = "z"
