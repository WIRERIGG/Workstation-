[workspace]
resolver = "2"
members = [
    "crates/wiredash-crypto",
    "crates/wiredash-db",
    "crates/wiredash-core",
    "crates/wiredash-sync",
    "crates/wiredash-theme",
    "crates/wiredash-editor",
    "crates/wiredash-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
